name: Test, build & deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  IMAGE: ghcr.io/testbox017-lab/alerts_bot

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      packages: read
    env:
      HAS_SSH: ${{ secrets.SSH_HOST != '' }}
    steps:
      - name: Skip (no SSH secrets yet)
        if: env.HAS_SSH != 'true'
        run: echo "::warning::SSH_HOST/SSH_USER/SSH_KEY не заданы в Secrets — деплой пропущен"
      - uses: actions/checkout@v4
        if: env.HAS_SSH == 'true'
      - name: Copy compose file
        if: env.HAS_SSH == 'true'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          source: docker-compose.yml
          target: ~/alerts_bot
      - name: Pull & restart
        if: env.HAS_SSH == 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            set -e
            # защита от деплоя не на тот сервер: секрет DEPLOY_HOSTNAME = вывод `hostname` на OVH
            want="${{ secrets.DEPLOY_HOSTNAME }}"
            if [ -n "$want" ] && [ "$(hostname)" != "$want" ]; then
              echo "::error::Не тот сервер: hostname не совпадает с DEPLOY_HOSTNAME"; exit 1
            fi
            echo "Контейнеры на сервере:"; docker ps --format '  {{.Names}}  ({{.Status}})'
            cd ~/alerts_bot
            test -f .env || { echo "Нет ~/alerts_bot/.env на сервере"; exit 1; }
            mkdir -p data && chown 1000:1000 data 2>/dev/null || sudo -n chown 1000:1000 data || true
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            docker compose pull
            docker compose up -d --remove-orphans
            docker logout ghcr.io
            docker image prune -f
